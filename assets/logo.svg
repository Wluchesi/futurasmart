<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 110" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#1E6091"/>
      <stop offset="100%" stop-color="#0D2149"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Symbol Icon: Smart Plaque Badge with NFC Waves & Star -->
  <g transform="translate(10, 10)">
    <!-- Base Plaque Outer Frame -->
    <rect x="5" y="5" width="76" height="84" rx="14" fill="url(#primaryGrad)" filter="url(#softGlow)"/>
    <!-- Inner Glass Layer -->
    <rect x="9" y="9" width="68" height="76" rx="10" fill="#0D2149" fill-opacity="0.85" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6"/>
    
    <!-- NFC Signal Radii -->
    <path d="M 43 45 A 14 14 0 0 1 57 59" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 43 37 A 22 22 0 0 1 65 59" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.75"/>
    <path d="M 43 29 A 30 30 0 0 1 73 59" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.45"/>

    <!-- Google 5-Star Symbol (Center Star) -->
    <path d="M 32 30 L 34.5 37.5 L 42 37.5 L 36 42 L 38.3 49.5 L 32 45 L 25.7 49.5 L 28 42 L 22 37.5 L 29.5 37.5 Z" fill="url(#accentGrad)"/>
    
    <!-- Smart QR Micro Grid Dots -->
    <rect x="20" y="56" width="6" height="6" rx="1.5" fill="#38BDF8"/>
    <rect x="28" y="56" width="6" height="6" rx="1.5" fill="#FFFFFF"/>
    <rect x="20" y="64" width="6" height="6" rx="1.5" fill="#FFFFFF"/>
    <rect x="28" y="64" width="6" height="6" rx="1.5" fill="#FBBF24"/>
  </g>

  <!-- Typography: FUTURA AVALIA SMART -->
  <g transform="translate(108, 20)">
    <!-- Main Brand Name -->
    <text x="0" y="36" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5" fill="#0F172A">
      FUTURA
    </text>
    <text x="145" y="36" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5" fill="#0284C7">
      AVALIA
    </text>
    <text x="285" y="36" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5" fill="#F59E0B">
      SMART
    </text>

    <!-- Subtitle / Concept -->
    <text x="2" y="60" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="3.5" fill="#475569">
      PLAQUINHAS INTELIGENTES
    </text>

    <!-- Secondary Star Accent -->
    <g transform="translate(245, 49) scale(0.65)">
      <polygon points="12,2 15,9 22,9 17,14 19,21 12,17 5,21 7,14 2,9 9,9" fill="#F59E0B"/>
    </g>
  </g>
</svg>
