<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 110" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="accentGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Symbol Icon: Smart Plaque Badge -->
  <g transform="translate(10, 10)">
    <rect x="5" y="5" width="76" height="84" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <rect x="9" y="9" width="68" height="76" rx="10" fill="#1E293B" stroke="#0284C7" stroke-width="1.5"/>
    
    <!-- NFC Signal Radii -->
    <path d="M 43 45 A 14 14 0 0 1 57 59" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 43 37 A 22 22 0 0 1 65 59" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8"/>
    <path d="M 43 29 A 30 30 0 0 1 73 59" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.5"/>

    <!-- Google 5-Star Symbol -->
    <path d="M 32 30 L 34.5 37.5 L 42 37.5 L 36 42 L 38.3 49.5 L 32 45 L 25.7 49.5 L 28 42 L 22 37.5 L 29.5 37.5 Z" fill="url(#accentGradW)"/>
    
    <!-- Smart QR Micro Grid Dots -->
    <rect x="20" y="56" width="6" height="6" rx="1.5" fill="#38BDF8"/>
    <rect x="28" y="56" width="6" height="6" rx="1.5" fill="#FFFFFF"/>
    <rect x="20" y="64" width="6" height="6" rx="1.5" fill="#FFFFFF"/>
    <rect x="28" y="64" width="6" height="6" rx="1.5" fill="#FBBF24"/>
  </g>

  <!-- Typography: FUTURA AVALIA SMART -->
  <g transform="translate(108, 20)">
    <text x="0" y="36" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5" fill="#FFFFFF">
      FUTURA
    </text>
    <text x="145" y="36" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5" fill="#38BDF8">
      AVALIA
    </text>
    <text x="285" y="36" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5" fill="#FBBF24">
      SMART
    </text>

    <!-- Subtitle / Concept -->
    <text x="2" y="60" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="3.5" fill="#94A3B8">
      PLAQUINHAS INTELIGENTES
    </text>
  </g>
</svg>
